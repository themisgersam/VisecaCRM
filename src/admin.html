<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card CRM Data Editor</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .tabs button { background: var(--neutral-bg); color: var(--text); }
    .tabs button.on { background: var(--accent); color: #fff; }
    .split { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
    @media (max-width: 800px) { .split { grid-template-columns: 1fr; } }
    .list { display: flex; flex-direction: column; gap: 4px; }
    .list button { text-align: left; background: transparent; color: var(--text); border: 1px solid transparent; font-weight: 500; }
    .list button.on { background: var(--tint); border-color: var(--accent); }
    .list small { display: block; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
    .grid label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    .cardbox { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 12px; background: var(--bg); }
    .cardbox .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 600; }
    button.danger { background: var(--bad-bg); color: var(--bad); }
    .row-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #172033; color: #fff; padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .inter { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: var(--bg); }
  </style>
</head>
<body>
  <header class="top"><h1>Card CRM · Mock data editor</h1><span class="sub">Changes save to this browser and are used by the CRM page immediately</span>
    <span class="spacer"></span><a href="index.html">← Back to CRM</a></header>
  <div class="admin" id="root"></div>
  <div class="toast" id="toast">Saved</div>
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
